name: macos

# The gate on the other platform the flake builds for, Nix on Apple silicon. The checks
# live in gate.yml; this file exists so the README states "builds on macOS" with a badge
# of its own
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/gate.yml
    with:
      runner: macos-latest
